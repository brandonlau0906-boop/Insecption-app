<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏢 驗樓助手 - 智慧視覺分析與報告生成器</title>
    <!-- 載入 Word 匯出元件 -->
    <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <!-- 載入免費內置 AI 模型 (TensorFlow.js + MobileNet) -->
    <script src="https://unpkg.com/@tensorflow/tfjs"></script>
    <script src="https://unpkg.com/@tensorflow-models/mobilenet"></script>
    
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { color: #1b365d; font-size: 24px; text-align: center; margin-bottom: 8px; }
        p.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
        .model-status { background: #e6f7ff; border: 1px solid #91d5ff; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; color: #0050b3; }
        .upload-area { border: 2px dashed #0066cc; background: #f0f7ff; padding: 30px; text-align: center; border-radius: 8px; cursor: pointer; }
        .upload-area:hover { background: #e1f0ff; }
        input[type="file"] { display: none; }
        .card { display: flex; flex-wrap: wrap; gap: 20px; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 20px; }
        .card-img { flex: 1 1 300px; text-align: center; }
        .card-img img { max-width: 100%; height: auto; max-height: 250px; border-radius: 6px; border: 1px solid #ddd; object-fit: cover; }
        .card-fields { flex: 1 1 350px; display: flex; flex-direction: column; gap: 10px; }
        label { font-weight: bold; font-size: 13px; color: #444; }
        input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        textarea { resize: vertical; height: 75px; }
        .btn-export { width: 100%; background: #1b365d; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 25px; }
        .btn-export:hover { background: #132744; }
        .badge { background: #52c41a; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 樓宇驗樓 智慧 AI 自動視覺分析與報告生成器</h1>
        <p class="subtitle">免 API Key、完全免費！自動辨識視覺特徵並產出對應缺陷描述與專業修補方案。</p>
        
        <div id="statusBox" class="model-status">⏳ 正在載入內置 AI 視覺模型，請稍候...</div>

        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <strong style="color: #0066cc;">點擊此處批次上載驗樓照片 (可多選)</strong>
            <p style="margin: 5px 0 0; font-size: 12px; color: #888;">支援 JPG, PNG 格式</p>
            <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFiles(this.files)">
        </div>

        <div id="cardsContainer"></div>

        <button id="exportBtn" class="btn-export" style="display: none;" onclick="exportWord()">📄 一鍵匯出 Word (.docx) 報告</button>
    </div>

    <script>
        let aiModel = null;
        let items = [];

        // 豐富的驗樓知識庫映射 (根據 AI 辨識的關鍵字自動帶入對應專業分析)
        const defectDatabase = [
            {
                keywords: ['pipe', 'tub', 'sink', 'faucet', 'plumbing', 'drain', 'shower'],
                location: '水喉 / 衛浴設施',
                type: '管道水喉狀況',
                severity: '中 (Medium)',
                description: '視覺特徵顯示為水喉及管道區域。需關注周邊是否有潮濕、積水或滲漏痕跡，金屬介面處是否有鏽蝕或鬆脫風化現象，避免日後造成牆體漏水風險。',
                recommendation: '建議進行通水與壓差測試，檢查水管接縫密封性。如有鏽蝕應更換接頭並加強防水矽膠（Sausage/Silicone）封堵。'
            },
            {
                keywords: ['wall', 'tile', 'brick', 'plaster', 'concrete'],
                location: '客廳 / 房間牆身及磁磚',
                type: '牆面抹灰 / 磁磚狀況',
                severity: '中 (Medium)',
                description: '檢測到牆面或粉刷結構。可能存在油漆剝落、微細髮絲裂紋或批盪不平整等問題，若未及時處置容易受潮膨脹剝落。',
                recommendation: '建議使用高清驗樓鎚進行敲擊試驗測試是否有空鼓。若有裂痕，需剷除鬆散油漆層，重新施作抗裂底漆與面漆。'
            },
            {
                keywords: ['window', 'glass', 'frame', 'sliding door', 'blind'],
                location: '窗戶 / 鋁窗區域',
                type: '鋁窗與玻璃組件',
                severity: '高 (High)',
                description: '發現窗框及玻璃結構。需特別關注窗框周邊防水膠條是否老化開裂、鎖扣是否順暢，若膠條老化在暴雨天極易引發滲水入室。',
                recommendation: '檢查窗框四角防水密封膠，更換老化硬化的防水膠條，並測試開關關閉緊密性與鎖扣功能。'
            },
            {
                keywords: ['door', 'cabinet', 'wood', 'furniture'],
                location: '門扇 / 木作櫃體',
                type: '木作與門窗貼皮',
                severity: '低 (Low)',
                description: '發現木製門扇或櫃體邊角。常見問題包含門扇關閉不順、門頁鉸鏈鬆動、木皮飾面受潮膨脹開裂或刮傷痕跡。',
                recommendation: '微調門頁鉸鏈金屬螺絲以矯正門扇下垂，對開裂木皮進行填縫補漆修飾，並確保周邊環境乾燥。'
            },
            {
                keywords: ['light', 'lamp', 'socket', 'switch', 'wire', 'electronic'],
                location: '開關面板 / 電器配線',
                type: '電力裝置與開關',
                severity: '高 (High)',
                description: '發現電器開關或線路區域。需驗證是否有線路外露、開關面板安裝不平整，或缺乏接地保護等安全隱患。',
                recommendation: '使用相位檢測器測試插座接線是否正確（火線、零線、地線），並確保所有面板緊貼牆面無鬆動。'
            },
            {
                keywords: ['floor', 'carpet', 'mat', 'pavement'],
                location: '地面 / 地磚飾面',
                type: '地板鋪設狀況',
                severity: '中 (Medium)',
                description: '發現地面鋪設材料。常見問題為地磚高低不平（打腳）、木地板起拱或邊縫過大，影響美觀及行走安全。',
                recommendation: '對高低不平處進行記錄，邊角縫隙過大處需使用同色填縫劑（Grout）補平，並重新壓實邊條。'
            }
        ];

        // 預設Fallback分析 (當 AI 辨識出一般物件時使用)
        const defaultDefect = {
            location: '室內結構區域',
            type: '一般現場組件檢查',
            severity: '低 (Low)',
            description: '現場照片顯示相關結構組件。請檢查表面是否有明顯劃痕、污漬、飾面不平整或邊條安裝不緊密等基礎缺陷。',
            recommendation: '清理表面殘留物，進行細部打磨與補漆修飾，並記錄現場狀況由承建商安排修繕。'
        };

        window.onload = async () => {
            try {
                aiModel = await mobilenet.load();
                document.getElementById('statusBox').style.background = '#f6ffed';
                document.getElementById('statusBox').style.borderColor = '#b7eb8f';
                document.getElementById('statusBox').style.color = '#389e0d';
                document.getElementById('statusBox').innerText = '✅ 智慧視覺 AI 模型準備就緒，可上載相片！';
            } catch (err) {
                document.getElementById('statusBox').innerText = '⚠️ AI 模型載入失敗，仍可手動輸入資料生成報告。';
            }
        };

        async function handleFiles(files) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            items = [];

            if (files.length > 0) {
                document.getElementById('exportBtn').style.display = 'block';
            }

            for (let index = 0; index < files.length; index++) {
                const file = files[index];
                const base64Img = await fileToBase64(file);

                const itemData = {
                    id: index,
                    imgData: base64Img,
                    location: `位置 #${index + 1}`,
                    type: '分析中...',
                    severity: '中 (Medium)',
                    description: '正在進行智慧視覺比對與風險分析...',
                    recommendation: '正在匹配最佳專業修補方案...'
                };
                items.push(itemData);
                renderCard(itemData);

                analyzeWithSmartAI(base64Img, index);
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        async function analyzeWithSmartAI(base64Img, index) {
            const imgElement = document.getElementById(`img-preview-${index}`);
            
            imgElement.onload = async () => {
                if (aiModel) {
                    try {
                        const predictions = await aiModel.classify(imgElement);
                        
                        // 取得 AI 預測的前 3 個特徵標籤
                        const labels = predictions.map(p => p.className.toLowerCase()).join(' ');
                        
                        // 尋找最佳匹配的數據庫條目
                        let matched = null;
                        for (let defect of defectDatabase) {
                            if (defect.keywords.some(kw => labels.includes(kw))) {
                                matched = defect;
                                break;
                            }
                        }

                        // 若無特殊匹配則使用預設並標註 AI 辨識特徵
                        if (!matched) {
                            const topLabel = predictions[0] ? predictions[0].className : '建築組件';
                            matched = {
                                ...defaultDefect,
                                description: `視覺辨識特徵包含 [${topLabel}]。${defaultDefect.description}`
                            };
                        }

                        // 更新數據
                        items[index].location = `${matched.location} (#${index + 1})`;
                        items[index].type = matched.type;
                        items[index].severity = matched.severity;
                        items[index].description = matched.description;
                        items[index].recommendation = matched.recommendation;

                        updateCardUI(index);
                    } catch (e) {
                        applyFallback(index);
                    }
                } else {
                    applyFallback(index);
                }
            };
        }

        function applyFallback(index) {
            items[index].location = `檢查位置 #${index + 1}`;
            items[index].type = defaultDefect.type;
            items[index].description = defaultDefect.description;
            items[index].recommendation = defaultDefect.recommendation;
            updateCardUI(index);
        }

        function renderCard(item) {
            const container = document.getElementById('cardsContainer');
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${item.id}`;
            card.innerHTML = `
                <div class="card-img">
                    <img id="img-preview-${item.id}" src="${item.imgData}" alt="Defect Photo">
                    <p style="font-size:12px; color:#666; margin-top:5px;">照片 #${item.id + 1}</p>
                </div>
                <div class="card-fields">
                    <div><span class="badge" id="status-${item.id}">🤖 智慧 AI 分析完成</span></div>
                    <div>
                        <label>位置 / 項目</label>
                        <input type="text" id="loc-${item.id}" value="${item.location}" onchange="items[${item.id}].location=this.value">
                    </div>
                    <div>
                        <label>缺陷類型</label>
                        <input type="text" id="type-${item.id}" value="${item.type}" onchange="items[${item.id}].type=this.value">
                    </div>
                    <div>
                        <label>嚴重程度</label>
                        <select id="sev-${item.id}" onchange="items[${item.id}].severity=this.value">
                            <option value="高 (High)">高 (High)</option>
                            <option value="中 (Medium)">中 (Medium)</option>
                            <option value="低 (Low)">低 (Low)</option>
                        </select>
                    </div>
                    <div>
                        <label>詳細描述與風險</label>
                        <textarea id="desc-${item.id}" onchange="items[${item.id}].description=this.value">${item.description}</textarea>
                    </div>
                    <div>
                        <label>建議修補方案</label>
                        <textarea id="rec-${item.id}" onchange="items[${item.id}].recommendation=this.value">${item.recommendation}</textarea>
                    </div>
                </div>
            `;
            container.appendChild(card);
        }

        function updateCardUI(index) {
            const item = items[index];
            document.getElementById(`loc-${index}`).value = item.location;
            document.getElementById(`type-${index}`).value = item.type;
            document.getElementById(`sev-${index}`).value = item.severity;
            document.getElementById(`desc-${index}`).value = item.description;
            document.getElementById(`rec-${index}`).value = item.recommendation;
        }

        async function exportWord() {
            const { Document, Packer, Paragraph, Table, TableRow, TableCell, WidthType, TextRun, ImageRun, AlignmentType, PageBreak } = docx;

            const children = [
                new Paragraph({
                    children: [
                        new TextRun({ text: "樓宇驗樓及缺陷分析報告 (Building Inspection Report)", bold: true, size: 36, color: "1B365D", font: "Microsoft JhengHei" })
                    ],
                    space: { after: 300 }
                })
            ];

            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const base64Data = item.imgData.split(',')[1];
                const binaryString = window.atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let j = 0; j < binaryString.length; j++) {
                    bytes[j] = binaryString.charCodeAt(j);
                }

                const fields = [
                    ["位置 / 項目", item.location],
                    ["缺陷類型", item.type],
                    ["嚴重程度", item.severity],
                    ["詳細描述與風險", item.description],
                    ["建議修補方案", item.recommendation]
                ];

                const infoRows = fields.map(([label, val]) => {
                    return new TableRow({
                        children: [
                            new TableCell({
                                width: { size: 30, type: WidthType.PERCENTAGE },
                                shading: { fill: "F2F4F7" },
                                children: [new Paragraph({ children: [new TextRun({ text: label, bold: true, size: 19, font: "Microsoft JhengHei" })] })]
                            }),
                            new TableCell({
                                width: { size: 70, type: WidthType.PERCENTAGE },
                                children: [new Paragraph({ children: [new TextRun({ text: val, size: 19, font: "Microsoft JhengHei" })] })]
                            })
                        ]
                    });
                });

                const outerTable = new Table({
                    width: { size: 100, type: WidthType.PERCENTAGE },
                    borders: {
                        top: { style: "none" }, bottom: { style: "none" },
                        left: { style: "none" }, right: { style: "none" },
                        insideHorizontal: { style: "none" }, insideVertical: { style: "none" }
                    },
                    rows: [
                        new TableRow({
                            children: [
                                new TableCell({
                                    width: { size: 45, type: WidthType.PERCENTAGE },
                                    children: [
                                        new Paragraph({
                                            alignment: AlignmentType.CENTER,
                                            children: [
                                                new ImageRun({
                                                    data: bytes,
                                                    transformation: { width: 220, height: 165 }
                                                })
                                            ]
                                        })
                                    ]
                                }),
                                new TableCell({
                                    width: { size: 55, type: WidthType.PERCENTAGE },
                                    children: [
                                        new Table({
                                            width: { size: 100, type: WidthType.PERCENTAGE },
                                            rows: infoRows
                                        })
                                    ]
                                })
                            ]
                        })
                    ]
                });

                children.push(outerTable);

                if (i < items.length - 1) {
                    children.push(new Paragraph({ children: [new PageBreak()] }));
                }
            }

            const doc = new Document({ sections: [{ properties: {}, children: children }] });
            const blob = await Packer.toBlob(doc);
            saveAs(blob, "Building_Inspection_Report.docx");
        }
    </script>
</body>
</html>
