<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏢 驗樓助手 - 專業視覺分析報告生成器</title>
    <!-- 載入 Word 匯出元件 -->
    <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <!-- 載入內置 AI 模型 (TensorFlow.js + MobileNet) -->
    <script src="https://unpkg.com/@tensorflow/tfjs"></script>
    <script src="https://unpkg.com/@tensorflow-models/mobilenet"></script>
    
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { color: #1b365d; font-size: 24px; text-align: center; margin-bottom: 8px; }
        p.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
        .model-status { background: #e6f7ff; border: 1px solid #91d5ff; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; color: #0050b3; }
        .upload-area { border: 2px dashed #0066cc; background: #f0f7ff; padding: 30px; text-align: center; border-radius: 8px; cursor: pointer; }
        .upload-area:hover { background: #e1f0ff; }
        input[type="file"] { display: none; }
        .card { display: flex; flex-wrap: wrap; gap: 20px; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 20px; }
        .card-img { flex: 1 1 300px; text-align: center; }
        .card-img img { max-width: 100%; height: auto; max-height: 250px; border-radius: 6px; border: 1px solid #ddd; object-fit: cover; }
        .card-fields { flex: 1 1 350px; display: flex; flex-direction: column; gap: 10px; }
        label { font-weight: bold; font-size: 13px; color: #444; }
        input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        textarea { resize: vertical; height: 85px; }
        .btn-export { width: 100%; background: #1b365d; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 25px; }
        .btn-export:hover { background: #132744; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; display: inline-block; font-weight: bold; }
        .badge-success { background: #52c41a; color: white; }
        .badge-warning { background: #fa8c16; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 樓宇驗樓 自動視覺分析與報告生成器</h1>
        <p class="subtitle">免 API Key、完全免費！自動轉譯專業中文驗樓風險描述與修補方案。</p>
        
        <div id="statusBox" class="model-status">⏳ 正在載入內置 AI 視覺模型，請稍候...</div>

        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <strong style="color: #0066cc;">點擊此處批次上載驗樓照片 (可多選)</strong>
            <p style="margin: 5px 0 0; font-size: 12px; color: #888;">支援 JPG, PNG 格式</p>
            <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFiles(this.files)">
        </div>

        <div id="cardsContainer"></div>

        <button id="exportBtn" class="btn-export" style="display: none;" onclick="exportWord()">📄 一鍵匯出 Word (.docx) 報告</button>
    </div>

    <script>
        let aiModel = null;
        let items = [];

        // 專業驗樓風險與描述資料庫
        const inspectRules = [
            {
                keys: ['pipe', 'tub', 'sink', 'faucet', 'plumbing', 'drain', 'shower', 'basin', 'toilet'],
                loc: '水喉管道 / 衛浴設施',
                type: '管道及水處設施檢查',
                sev: '中 (Medium)',
                desc: '現場相片顯示為管道或衛浴區域。重點觀察管路接縫是否有水漬滲漏痕跡、金屬配件風化鏽蝕，若長時間未有處置易引發牆體發霉及下層漏水風險。',
                rec: '進行通水壓力測試，檢查排水順暢度。拆除老化矽膠密封條並重新打膠，替換風化嚴重之金屬接頭。'
            },
            {
                keys: ['wall', 'tile', 'brick', 'plaster', 'concrete', 'stone'],
                loc: '牆面抹灰 / 飾面磁磚',
                type: '牆面及磁磚狀況檢查',
                sev: '中 (Medium)',
                desc: '現場相片顯示為牆面或飾面結構。需關注是否有漆面膨脹起泡、微細髮絲裂紋或磁磚空鼓現象，若水氣滲入可能導致批盪層大規模剝落。',
                rec: '使用專業驗樓敲擊棒進行全盤空鼓測試；裂紋處需剷除鬆散舊漆層，重新施作防水底漆與抗裂面漆。'
            },
            {
                keys: ['window', 'glass', 'frame', 'sliding'],
                loc: '鋁窗框體 / 玻璃組件',
                type: '鋁窗結構與防水膠條檢查',
                sev: '高 (High)',
                desc: '現場相片顯示為窗框或玻璃區域。需關注窗框四角防水膠條是否硬化開裂、鎖扣與鉸鏈鬆動，颱風或暴雨天極易引發雨水倒灌滲漏。',
                rec: '檢查窗框固定螺絲，更換老化變形的防水軟膠條，並於外框邊縫重新填補耐候型玻璃矽膠。'
            },
            {
                keys: ['door', 'cabinet', 'wood', 'table', 'chair'],
                loc: '木作門扇 / 櫃體設施',
                type: '木作飾面與結構檢查',
                sev: '低 (Low)',
                desc: '現場相片顯示為木作門扇或櫃體區域。常見缺陷包括表面劃痕傷痕、木皮受潮膨脹起起、門扇開合碰撞或鉸鏈下垂。',
                rec: '調整門頁鉸鏈螺絲以校正關閉間隙，針對表面磨損進行專用木作補漆修飾，保持周邊通風乾燥。'
            },
            {
                keys: ['light', 'lamp', 'socket', 'switch', 'wire', 'electronic', 'plug'],
                loc: '開關插座 / 電力裝置',
                type: '電力裝置與面板安全性檢查',
                sev: '高 (High)',
                desc: '現場相片顯示為開關面板或電器線路。重點為面板安裝是否緊密貼牆、是否有線路外露或缺乏接地保護，存在漏電及短路安全隱患。',
                rec: '使用相位檢測儀測試極性及接地狀況，重新固定鬆動面板，對外露線路加裝絕緣保護套管。'
            }
        ];

        window.onload = async () => {
            try {
                aiModel = await mobilenet.load();
                document.getElementById('statusBox').style.background = '#f6ffed';
                document.getElementById('statusBox').style.borderColor = '#b7eb8f';
                document.getElementById('statusBox').style.color = '#389e0d';
                document.getElementById('statusBox').innerText = '✅ 視覺 AI 分析引擎已準備就緒！';
            } catch (err) {
                document.getElementById('statusBox').innerText = '⚠️ AI 模型初始化失敗，仍可手動編輯與生成報告。';
            }
        };

        async function handleFiles(files) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            items = [];

            if (files.length > 0) {
                document.getElementById('exportBtn').style.display = 'block';
            }

            for (let index = 0; index < files.length; index++) {
                const file = files[index];
                const base64Img = await fileToBase64(file);

                const itemData = {
                    id: index,
                    imgData: base64Img,
                    location: `位置 #${index + 1}`,
                    type: '分析中...',
                    severity: '中 (Medium)',
                    description: '正在分析照片結構細節...',
                    recommendation: '正在匹配最佳修補方案...',
                    detected: false
                };
                items.push(itemData);
                renderCard(itemData);

                analyzeImage(base64Img, index);
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        async function analyzeImage(base64Img, index) {
            const imgElement = document.getElementById(`img-preview-${index}`);
            
            imgElement.onload = async () => {
                if (aiModel) {
                    try {
                        const predictions = await aiModel.classify(imgElement);
                        
                        let matched = null;
                        if (predictions && predictions.length > 0 && predictions[0].probability > 0.12) {
                            const labelString = predictions.map(p => p.className.toLowerCase()).join(' ');
                            for (let rule of inspectRules) {
                                if (rule.keys.some(k => labelString.includes(k))) {
                                    matched = rule;
                                    break;
                                }
                            }
                        }

                        if (matched) {
                            items[index].location = `${matched.loc} (#${index + 1})`;
                            items[index].type = matched.type;
                            items[index].severity = matched.sev;
                            items[index].description = matched.desc;
                            items[index].recommendation = matched.rec;
                            items[index].detected = true;
                        } else {
                            // 未能完全匹配時，給予清晰提示
                            items[index].location = `檢查區域 (#${index + 1})`;
                            items[index].type = '待填寫項目';
                            items[index].severity = '中 (Medium)';
                            items[index].description = '⚠️ 無法自動識別此照片之建築缺陷，請點擊此處輸入詳細描述與風險。';
                            items[index].recommendation = '⚠️ 無法自動識別此照片之建築缺陷，請點擊此處輸入建議修補方案。';
                            items[index].detected = false;
                        }

                        updateCardUI(index);
                    } catch (e) {
                        applyUnrecognized(index);
                    }
                } else {
                    applyUnrecognized(index);
                }
            };
        }

        function applyUnrecognized(index) {
            items[index].location = `檢查區域 (#${index + 1})`;
            items[index].type = '待填寫項目';
            items[index].severity = '中 (Medium)';
            items[index].description = '⚠️ 無法自動識別此照片之建築缺陷，請點擊此處輸入詳細描述與風險。';
            items[index].recommendation = '⚠️ 無法自動識別此照片之建築缺陷，請點擊此處輸入建議修補方案。';
            items[index].detected = false;
            updateCardUI(index);
        }

        function renderCard(item) {
            const container = document.getElementById('cardsContainer');
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${item.id}`;
            card.innerHTML = `
                <div class="card-img">
                    <img id="img-preview-${item.id}" src="${item.imgData}" alt="Defect Photo">
                    <p style="font-size:12px; color:#666; margin-top:5px;">照片 #${item.id + 1}</p>
                </div>
                <div class="card-fields">
                    <div><span class="badge badge-warning" id="status-${item.id}">⏳ 分析中...</span></div>
                    <div>
                        <label>位置 / 項目</label>
                        <input type="text" id="loc-${item.id}" value="${item.location}" onchange="items[${item.id}].location=this.value">
                    </div>
                    <div>
                        <label>缺陷類型</label>
                        <input type="text" id="type-${item.id}" value="${item.type}" onchange="items[${item.id}].type=this.value">
                    </div>
                    <div>
                        <label>嚴重程度</label>
                        <select id="sev-${item.id}" onchange="items[${item.id}].severity=this.value">
                            <option value="高 (High)">高 (High)</option>
                            <option value="中 (Medium)">中 (Medium)</option>
                            <option value="低 (Low)">低 (Low)</option>
                        </select>
                    </div>
                    <div>
                        <label>詳細描述與風險</label>
                        <textarea id="desc-${item.id}" onchange="items[${item.id}].description=this.value">${item.description}</textarea>
                    </div>
                    <div>
                        <label>建議修補方案</label>
                        <textarea id="rec-${item.id}" onchange="items[${item.id}].recommendation=this.value">${item.recommendation}</textarea>
                    </div>
                </div>
            `;
            container.appendChild(card);
        }

        function updateCardUI(index) {
            const item = items[index];
            document.getElementById(`loc-${index}`).value = item.location;
            document.getElementById(`type-${index}`).value = item.type;
            document.getElementById(`sev-${index}`).value = item.severity;
            document.getElementById(`desc-${index}`).value = item.description;
            document.getElementById(`rec-${index}`).value = item.recommendation;

            const badge = document.getElementById(`status-${index}`);
            if (item.detected) {
                badge.className = 'badge badge-success';
                badge.innerText = '✅ 智慧分析完成';
            } else {
                badge.className = 'badge badge-warning';
                badge.innerText = '⚠️️ 請手動補充內容';
            }
        }

        async function exportWord() {
            const { Document, Packer, Paragraph, Table, TableRow, TableCell, WidthType, TextRun, ImageRun, AlignmentType, PageBreak } = docx;

            const children = [
                new Paragraph({
                    children: [
                        new TextRun({ text: "樓宇驗樓及缺陷分析報告 (Building Inspection Report)", bold: true, size: 36, color: "1B365D", font: "Microsoft JhengHei" })
                    ],
                    space: { after: 300 }
                })
            ];

            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const base64Data = item.imgData.split(',')[1];
                const binaryString = window.atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let j = 0; j < binaryString.length; j++) {
                    bytes[j] = binaryString.charCodeAt(j);
                }

                const fields = [
                    ["位置 / 項目", item.location],
                    ["缺陷類型", item.type],
                    ["嚴重程度", item.severity],
                    ["詳細描述與風險", item.description],
                    ["建議修補方案", item.recommendation]
                ];

                const infoRows = fields.map(([label, val]) => {
                    return new TableRow({
                        children: [
                            new TableCell({
                                width: { size: 30, type: WidthType.PERCENTAGE },
                                shading: { fill: "F2F4F7" },
                                children: [new Paragraph({ children: [new TextRun({ text: label, bold: true, size: 19, font: "Microsoft JhengHei" })] })]
                            }),
                            new TableCell({
                                width: { size: 70, type: WidthType.PERCENTAGE },
                                children: [new Paragraph({ children: [new TextRun({ text: val, size: 19, font: "Microsoft JhengHei" })] })]
                            })
                        ]
                    });
                });

                const outerTable = new Table({
                    width: { size: 100, type: WidthType.PERCENTAGE },
                    borders: {
                        top: { style: "none" }, bottom: { style: "none" },
                        left: { style: "none" }, right: { style: "none" },
                        insideHorizontal: { style: "none" }, insideVertical: { style: "none" }
                    },
                    rows: [
                        new TableRow({
                            children: [
                                new TableCell({
                                    width: { size: 45, type: WidthType.PERCENTAGE },
                                    children: [
                                        new Paragraph({
                                            alignment: AlignmentType.CENTER,
                                            children: [
                                                new ImageRun({
                                                    data: bytes,
                                                    transformation: { width: 220, height: 165 }
                                                })
                                            ]
                                        })
                                    ]
                                }),
                                new TableCell({
                                    width: { size: 55, type: WidthType.PERCENTAGE },
                                    children: [
                                        new Table({
                                            width: { size: 100, type: WidthType.PERCENTAGE },
                                            rows: infoRows
                                        })
                                    ]
                                })
                            ]
                        })
                    ]
                });

                children.push(outerTable);

                if (i < items.length - 1) {
                    children.push(new Paragraph({ children: [new PageBreak()] }));
                }
            }

            const doc = new Document({ sections: [{ properties: {}, children: children }] });
            const blob = await Packer.toBlob(doc);
            saveAs(blob, "Building_Inspection_Report.docx");
        }
    </script>
</body>
</html>
